# Production only. Fronts the static build and the Rails API on one origin, so
# the browser never makes a cross-origin request and there is no preflight.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Written now rather than retrofitted. Turnstile (Phase 8) needs
    # challenges.cloudflare.com in script-src and frame-src; 'self' in img-src
    # covers /uploads (Phase 9).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 25m;

    # The GraphQL endpoint carries the whole app. GET for queries (cacheable),
    # POST for mutations.
    location /graphql {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The REST edge: .ics calendar feeds (Phase 9) return text/calendar to
    # Google Calendar and Apple Calendar, which cannot speak GraphQL. /up is the
    # plain-HTTP liveness check.
    location ~ ^/(api|calendar|up) {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Filenames are content-hashed, so they can be cached indefinitely.
    location ~* \.(js|css|woff2|png|jpg|svg|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy serves stale asset names.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes deep-link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
